# Tests, puis construction de l'image (les 12 applis embarquées, construites depuis leurs dépôts), essais de bout en
# bout DANS l'image (chaque appli démarre, s'ouvre par le relais ; soirée Douze points ; carnet), puis publication.
name: Image Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Place disque (image de plusieurs Go)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes de l'image
        id: etiquettes
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          depot=ghcr.io/${{ github.repository_owner }}/bac-a-sable
          echo "tags=$depot:latest,$depot:$version,$depot:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Image d'essai
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: essai:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Essais de bout en bout dans l'image
        run: |
          docker run --rm --entrypoint sh -e BAC_ESSAI_APPLIS=/applis -e BAC_ESSAI_PYTHON=/usr/local/bin/python \
            -e PYTHONPATH=/app:/applis/_commun -w /app essai:local \
            -c "python -m pytest -q -rs tests/ -p no:cacheprovider"
      - name: Démarrage de l'image
        run: |
          if timeout 30 docker run --rm essai:local >/dev/null 2>&1; then echo "a démarré sans mot de passe"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/donnees"
          docker run -d --name essai -v "$RUNNER_TEMP/donnees:/data" -e MAISON_PASSWORD=essai-essai-essai \
            -p 8104:8104 -p 8110-8121:8110-8121 essai:local
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8104/health >/dev/null && break; sleep 1; done
          docker logs essai 2>&1 | tail -20
          curl -fs http://127.0.0.1:8104/health
          test "$(curl -s http://127.0.0.1:8104/health | python3 -c 'import sys,json;print(json.load(sys.stdin)["coupure"])')" = True
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8104/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8114/api/soirees)" = 401
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          cache-from: type=gha
      - name: Étiquette Git de version
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          if [ -n "$version" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            git tag "v$version" "$GITHUB_SHA"
            git push origin "v$version"
          fi
