# Service bac-a-sable à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
#
# Réseau : le Bac à sable est volontairement sur un réseau à lui, PAS sur le réseau de la stack : les noms des
# services de la maison (immich_server, anneau, carnet…) n'y existent pas. En plus, chaque appli simulée tourne
# derrière une garde qui refuse toute sortie (voir l'autotest dans Réglages). Seul le Bac à sable lui-même peut
# joindre carnet, par BAC_CARNET_URL, pour copier de vraies fiches (lecture seule) : facultatif.
services:
  bac-a-sable:
    image: ghcr.io/baloodusudouest/bac-a-sable:${BAC_VERSION:-latest}
    container_name: bac-a-sable
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - bac-a-sable
    ports:
      - "8104:8104"           # écran du Bac à sable
      - "8110-8121:8110-8121" # une appli simulée par port (relais)
    environment:
      - TZ=Europe/Paris
      - MAISON_PASSWORD=${MAISON_PASSWORD}       # mot de passe commun (connexion au Bac à sable)
      - MAISON_JETON=${MAISON_JETON:-}           # jeton commun : sauvegarde des réglages par l'Anneau, copie depuis carnet
      - BAC_CARNET_URL=${BAC_CARNET_URL:-}       # adresse de carnet vue depuis ce conteneur ; vide : pas de copie de vraies fiches
      - BAC_AUTOTEST=${BAC_AUTOTEST:-}           # adresses à essayer en plus à l'autotest (hôte:port, séparées par des virgules)
      - BAC_ARRET_MINUTES=${BAC_ARRET_MINUTES:-30}
      - BAC_MAX_SIMULTANEES=${BAC_MAX_SIMULTANEES:-4}
    volumes:
      - ${DOCKER_ROOT}/bac-a-sable:/data          # à exclure des sauvegardes (copies de vraies fiches)
    mem_limit: 3g

networks:
  bac-a-sable:
    name: bac-a-sable
