# Bac à sable — les applis maison embarquées.
#
# Une entrée par appli. Mettre à jour une appli simulée : changer `version` (étiquette de son image ghcr,
# d'où l'on copie son site-packages et son interface bâtie) et `sha` (commit de son dépôt, d'où l'on copie
# le code, les tests et le lanceur de démonstration), puis `python tools/dockerfile.py` et republier l'image.
#
# Champs :
#   nom         nom affiché
#   depot       dépôt public baloodusudouest/<depot>
#   version     version embarquée (étiquette de l'image)
#   sha         commit du dépôt pour cette version
#   port        port publié par le Bac à sable (le relais) ; l'appli elle-même écoute sur port + 1000, en local
#   lanceur     « demo » (lanceur de démonstration du dépôt) ou « bac » (lanceur écrit ici, dans lanceurs/)
#   module      module ou script lancé (pour « demo »)
#   args        arguments, avec {dossier} et {port} ; pour « bac » : ignoré
#   env         variables propres à ce lancement (jamais une vraie adresse ni une vraie clé)
#   mot_de_passe  mot de passe de la démonstration : le relais se connecte seul avec lui
#   site        dossier site-packages dans l'image de l'appli
#   static      dossier de l'interface bâtie dans l'image de l'appli
#   personnes   « oui » si le scénario y verse des personnes (sinon : données de démonstration du dépôt)
#   memoire     mémoire maximale, en Mo (le processus est arrêté au-delà)

applis:
  anneau:
    nom: L'Anneau
    depot: anneau
    version: 0.16.1
    sha: f2a811486712e361b9d1111fcc7d5029198cdcbe
    port: 8110
    lanceur: demo
    module: tests.interface.serveur
    args: ["{dossier}", "{port}"]
    mot_de_passe: essai-essai-essai
    site: /usr/local/lib/python3.12/site-packages
    static: /app/app/static
    personnes: non
    memoire: 300
